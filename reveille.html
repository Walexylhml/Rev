<meta name="claude:viewport-fit-sides" content="cover">
<title>Reveille</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app shell — static header, scrolling main, static bottom tab bar; onboarding & player are full-screen overlays. Tactical/HUD identity. */
:root{
  --bg:#EDEDE8; --surface:#FFFFFF; --surface-2:#F5F5F0; --surface-3:#ECECE5;
  --line:#D9D9D1; --line-strong:#C4C4B9;
  --fg:#15181A; --fg-2:#3A403C; --muted:#5E655F; --faint:#8A9089;
  --accent:#A85F00; --accent-bg:#F6AF2A; --accent-ink:#1A1206;
  --run:#0C6F6C; --run-bg:#19A8A2;
  --good:#3E7A33; --warn:#9A6B06; --crit:#B23A2A;
  --shadow:0 1px 2px rgba(20,24,20,.06),0 6px 20px rgba(20,24,20,.06);
  --r:14px; --r-sm:10px;
  --font-display:'Oswald','Arial Narrow',sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1110; --surface:#161B19; --surface-2:#1C2320; --surface-3:#232B27;
  --line:#2A312E; --line-strong:#3A433E;
  --fg:#ECEFEC; --fg-2:#C7CEC8; --muted:#8E978F; --faint:#6B746D;
  --accent:#F6AF2A; --accent-bg:#F6AF2A; --accent-ink:#1A1206;
  --run:#34C7C0; --run-bg:#19A8A2;
  --good:#6FBF5B; --warn:#F3B13C; --crit:#E5634D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1110; --surface:#161B19; --surface-2:#1C2320; --surface-3:#232B27;
  --line:#2A312E; --line-strong:#3A433E;
  --fg:#ECEFEC; --fg-2:#C7CEC8; --muted:#8E978F; --faint:#6B746D;
  --accent:#F6AF2A; --accent-bg:#F6AF2A; --accent-ink:#1A1206;
  --run:#34C7C0; --run-bg:#19A8A2;
  --good:#6FBF5B; --warn:#F3B13C; --crit:#E5634D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;overflow:hidden;
  display:flex;flex-direction:column;}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:16px;color:var(--fg)}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:.01em;line-height:1.05;text-wrap:balance}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;color:var(--muted)}
a{color:var(--accent)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}

/* ---------- App shell ---------- */
#app{display:flex;flex-direction:column;height:100%;min-height:0}
#appbar{flex:none;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar-in{display:flex;align-items:center;gap:12px;min-height:54px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:16px}
.brand .chev{color:var(--accent)}
.appbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);color:var(--fg-2)}
.icon-btn:hover{border-color:var(--line-strong)}
#main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 26px;max-width:720px;margin:0 auto}

/* ---------- Bottom tab bar ---------- */
#tabbar{flex:none;background:var(--surface);border-top:1px solid var(--line)}
.tabbar-in{display:flex;max-width:720px;margin:0 auto;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 9px;color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.03em}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--accent)}
.tab[aria-current="true"] .tab-dot{opacity:1}
.tab-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;margin-top:-1px}

/* ---------- Generic blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 11px}
.sec-head h2{font-size:21px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;font-weight:600;
  padding:13px 18px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--fg);font-size:15px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent-bg);border-color:transparent;color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.run{background:var(--run-bg);border-color:transparent;color:#04201F}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn.lg{padding:16px 20px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--fg-2);background:var(--surface-2)}
.pill.amber{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent-bg) 14%,transparent)}
.pill.run{color:var(--run);border-color:color-mix(in srgb,var(--run) 45%,transparent);background:color-mix(in srgb,var(--run-bg) 14%,transparent)}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 13%,transparent)}
.pill.ghost{background:transparent;border-color:var(--line)}

/* ---------- Today hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:18px;background:
  radial-gradient(130% 100% at 100% 0%,color-mix(in srgb,var(--accent-bg) 20%,transparent),transparent 60%),var(--surface);
  border:1px solid var(--line)}
.hero.restday{background:var(--surface)}
.hero.runday{background:radial-gradient(130% 100% at 100% 0%,color-mix(in srgb,var(--run-bg) 20%,transparent),transparent 60%),var(--surface)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero h1{font-size:30px;margin-top:8px;letter-spacing:.01em}
.hero .focus{color:var(--muted);margin-top:3px;font-weight:500}
.hero-meta{display:flex;gap:16px;margin:16px 0 4px;flex-wrap:wrap}
.hero-meta .m{display:flex;flex-direction:column}
.hero-meta .m b{font-family:var(--font-display);font-size:20px;font-weight:600}
.hero-meta .m span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ring{--p:0;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent-bg) calc(var(--p)*1%),var(--line) 0);flex:none}
.ring i{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--font-display);font-size:13px;font-weight:600;font-style:normal}

/* streak strip */
.strip{display:flex;gap:7px;margin-top:4px}
.strip .d{flex:1;text-align:center}
.strip .d .lab{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.strip .d .dot{margin:5px auto 0;width:100%;height:30px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-size:12px;color:var(--faint)}
.strip .d.done .dot{background:color-mix(in srgb,var(--accent-bg) 22%,var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.strip .d.run .dot{background:color-mix(in srgb,var(--run-bg) 20%,var(--surface));border-color:color-mix(in srgb,var(--run) 40%,transparent);color:var(--run)}
.strip .d.today .dot{outline:2px solid var(--accent);outline-offset:1px}
.strip .d.rest .dot{opacity:.65}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 12px 11px}
.tile .v{font-family:var(--font-display);font-weight:600;font-size:25px;line-height:1}
.tile .v small{font-size:13px;color:var(--muted);font-weight:500}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:5px;font-weight:600}

/* session list rows */
.srow{display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.srow+.srow{margin-top:9px}
.srow .badge{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2)}
.srow.run .badge{color:var(--run)}
.srow.str .badge{color:var(--accent)}
.srow .t{flex:1;min-width:0}
.srow .t b{display:block;font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.01em}
.srow .t span{font-size:12.5px;color:var(--muted)}
.srow.done{opacity:.72}
.srow.done .badge{background:color-mix(in srgb,var(--good) 16%,var(--surface));border-color:color-mix(in srgb,var(--good) 35%,transparent);color:var(--good)}
.srow .chev{color:var(--faint)}

/* exercise block preview */
.exline{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px dashed var(--line)}
.exline:first-child{border-top:none}
.exline .n{flex:1;min-width:0}
.exline .n b{font-weight:600}
.exline .n span{display:block;font-size:12px;color:var(--muted)}
.exline .tgt{font-family:var(--font-mono);font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.exline .tgt small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase}

/* ---------- Forms / onboarding ---------- */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field>label{font-weight:600;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);font-size:16px}
.input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.seg{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface)}
.opt:hover{border-color:var(--faint)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent-bg) 10%,var(--surface))}
.opt .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--line-strong);flex:none;margin-top:2px;display:grid;place-items:center}
.opt.sel .ck{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink)}
.opt .ck svg{width:13px;height:13px;opacity:0}
.opt.sel .ck svg{opacity:1}
.opt.pickradio .ck{border-radius:50%}
.opt .ob{flex:1}
.opt .ob b{display:block;font-weight:600;font-size:15px}
.opt .ob span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps{display:flex;gap:5px;margin-bottom:4px}
.steps i{height:4px;flex:1;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent-bg)}
.ob-head{margin:4px 0 18px}
.ob-head .eyebrow{display:block;margin-bottom:8px}
.ob-head h2{font-size:26px}
.ob-head p{color:var(--muted);margin:8px 0 0}
#onboarding{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.ob-scroll{flex:1;min-height:0;overflow-y:auto}
.ob-inner{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px}
.ob-foot{flex:none;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.ob-foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.counter{display:flex;align-items:center;gap:14px;justify-content:center;margin:6px 0}
.counter button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:24px;font-family:var(--font-display);display:grid;place-items:center}
.counter .val{font-family:var(--font-display);font-weight:600;font-size:40px;min-width:92px;text-align:center}
.counter .val small{font-size:14px;color:var(--muted);display:block;text-transform:uppercase;letter-spacing:.08em;margin-top:-4px}

/* ---------- Player ---------- */
#player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.pl-top{flex:none;display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px}
.pl-prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.pl-prog i{display:block;height:100%;background:var(--accent-bg);width:0;transition:width .3s}
.pl-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:10px}
.pl-in{max-width:460px;margin:0 auto;width:100%;text-align:center}
.pl-foot{flex:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.pl-foot .in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.pl-kicker{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:12px;color:var(--muted)}
.pl-name{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.02;margin:12px 0 6px}
.pl-cue{color:var(--muted);max-width:40ch;margin:0 auto;font-size:14px}
.bigtimer{font-family:var(--font-mono);font-weight:700;font-size:74px;line-height:1;letter-spacing:-.02em;margin:18px 0}
.bigtimer.rest{color:var(--run)}
.repbig{font-family:var(--font-display);font-weight:700;font-size:92px;line-height:.9}
.repbig small{font-size:22px;color:var(--muted);font-weight:500}
.logrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 2px}
.logrow input{width:88px;text-align:center;font-family:var(--font-mono);font-weight:700;font-size:22px;padding:10px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface)}
.stepdots{display:flex;gap:5px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.stepdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.stepdots i.done{background:var(--accent-bg)}
.stepdots i.cur{background:var(--fg);transform:scale(1.3)}

/* chart */
.chart-card{padding:15px 14px 10px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.chart-head h3{font-size:15px;font-family:var(--font-body);font-weight:600}
.chart-head .delta{font-family:var(--font-mono);font-size:12px;font-weight:700}
.chart-wrap{width:100%;overflow:visible}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{fill:var(--faint);font-size:10px;font-family:var(--font-mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.legend b{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--fg-2)}
.legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block}

.empty{text-align:center;padding:30px 18px;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:8px}
.empty b{display:block;color:var(--fg);font-family:var(--font-display);font-weight:600;font-size:17px;margin-bottom:3px}

.note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.divider{height:1px;background:var(--line);margin:18px 0}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600}
.link{color:var(--accent);font-weight:600;background:none;padding:0;text-decoration:underline;text-underline-offset:2px}
/* exercise motion figure */
.figbox{position:relative;background:radial-gradient(130% 130% at 50% 0%,var(--surface-3),var(--surface-2));border:1px solid var(--line);border-radius:16px;aspect-ratio:1/1;width:100%;max-width:168px;margin:0 auto;color:var(--accent-bg);overflow:hidden}
.figbox.run-c{color:var(--run-bg)}
.figbox svg{width:100%;height:100%;display:block}
.figbox .floor{stroke:var(--line-strong)}
.figbox.player{max-width:132px;margin:14px auto 2px}
.ex-tap{display:flex;width:100%;text-align:left;align-items:center;gap:11px;background:none;padding:0}
.ex-tap>div{flex:1;min-width:0}
.ex-tap .info{flex:none;color:var(--faint);width:22px;height:22px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line)}
/* exercise detail overlay */
#exsheet{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.ex-top{flex:none;display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line)}
.ex-top b{font-family:var(--font-display);font-size:18px;letter-spacing:.02em}
.ex-scroll{flex:1;min-height:0;overflow-y:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px}
.ex-in{max-width:460px;margin:0 auto}
.ex-in .figbox{max-width:220px}
.ex-foot{flex:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ex-foot .in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.cuecard{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:14px}
.cuecard h4{font-family:var(--font-body);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:5px}
.cuecard p{margin:0;color:var(--fg-2)}
.mistake h4{color:var(--warn)}
a.btn{text-decoration:none}

<script>
"use strict";
/* ============================== STORE ============================== */
var KEY="reveille_v1";
var S=load();
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return{profile:null,logs:{},weights:[],settings:{},curWeek:1,custom:[]};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ============================== EXERCISE LIBRARY ============================== */
/* type: reps | time | cardio ; cat: push pull legs core cond run ; equip gate */
var LIB={
  pushup:{name:"Push-ups",type:"reps",cat:"push",cue:"Hands under shoulders, body in one line, chest to within a fist of the floor."},
  incline_pushup:{name:"Incline Push-ups",type:"reps",cat:"push",cue:"Hands on a bench or step. Easier angle — keep the plank line."},
  knee_pushup:{name:"Knee Push-ups",type:"reps",cat:"push",cue:"Knees down, hips straight. Full range still counts."},
  diamond_pushup:{name:"Diamond Push-ups",type:"reps",cat:"push",cue:"Hands together under chest. Hits triceps hard."},
  pike_pushup:{name:"Pike Push-ups",type:"reps",cat:"push",cue:"Hips high, head travels toward the floor between the hands. Shoulder builder."},
  dip_chair:{name:"Bench Dips",type:"reps",cat:"push",cue:"Hands on a chair behind you, elbows back, dip to 90°."},
  pullup:{name:"Pull-ups",type:"reps",cat:"pull",equip:"bar",cue:"Dead hang, pull chin over the bar, control the way down."},
  chinup:{name:"Chin-ups",type:"reps",cat:"pull",equip:"bar",cue:"Palms toward you — a little more biceps, often easier than pull-ups."},
  neg_pullup:{name:"Negative Pull-ups",type:"reps",cat:"pull",equip:"bar",cue:"Jump to the top, lower as slowly as you can (aim 3–5s)."},
  inv_row:{name:"Inverted Rows",type:"reps",cat:"pull",cue:"Under a sturdy table or low bar, body straight, pull chest up."},
  band_row:{name:"Band Rows",type:"reps",cat:"pull",equip:"bands",cue:"Anchor the band, squeeze shoulder blades, control the return."},
  db_row:{name:"Dumbbell Rows",type:"reps",cat:"pull",equip:"db",cue:"One knee on a bench, pull the weight to the hip."},
  squat:{name:"Bodyweight Squats",type:"reps",cat:"legs",cue:"Feet shoulder-width, sit back and down, knees tracking toes."},
  lunge:{name:"Reverse Lunges",type:"reps",cat:"legs",cue:"Step back, drop the back knee, drive through the front heel. Count per leg."},
  split_squat:{name:"Bulgarian Split Squats",type:"reps",cat:"legs",cue:"Rear foot elevated, drop straight down. Per leg."},
  glute_bridge:{name:"Glute Bridges",type:"reps",cat:"legs",cue:"Drive hips up, squeeze at the top, slow down."},
  calf_raise:{name:"Calf Raises",type:"reps",cat:"legs",cue:"Full range, pause at the top."},
  wall_sit:{name:"Wall Sit",type:"time",cat:"legs",cue:"Thighs parallel to the floor, back flat on the wall. Hold."},
  plank:{name:"Front Plank",type:"time",cat:"core",cue:"Forearms down, glutes and abs tight, flat line head to heel."},
  side_plank:{name:"Side Plank",type:"time",cat:"core",cue:"Stack the hips, lift tall. Hold each side."},
  hollow:{name:"Hollow Hold",type:"time",cat:"core",cue:"Low back pressed down, shoulders and legs off the floor."},
  leg_raise:{name:"Lying Leg Raises",type:"reps",cat:"core",cue:"Legs straight, lower slow, keep the low back glued down."},
  bicycle:{name:"Bicycle Crunches",type:"reps",cat:"core",cue:"Opposite elbow to knee, slow and controlled. Count per side."},
  flutter:{name:"Flutter Kicks",type:"time",cat:"core",cue:"Small fast scissor kicks, low back down."},
  mtn_climber:{name:"Mountain Climbers",type:"time",cat:"cond",cue:"Hips low, drive knees fast. A plank that runs."},
  burpee:{name:"Burpees",type:"reps",cat:"cond",cue:"Chest to floor, jump feet in, jump up. Pace yourself."},
  jump_squat:{name:"Jump Squats",type:"reps",cat:"cond",cue:"Squat, explode up, land soft and quiet."},
  high_knees:{name:"High Knees",type:"time",cat:"cond",cue:"Run in place, knees to hip height, fast arms."},
  jumping_jack:{name:"Jumping Jacks",type:"time",cat:"cond",cue:"Steady rhythm, full arm sweep."},
  skater:{name:"Skater Hops",type:"time",cat:"cond",cue:"Bound side to side, land on one leg, stay low."}
};

/* ============================== PLAN ENGINE ============================== */
var WEEKS=8;
var PROG=[1.00,1.10,1.20,0.70,1.25,1.35,1.45,0.75]; // index = week-1 ; weeks 4 & 8 deload
function isDeload(w){return w===4||w===8;}

function has(equip,tag){return !tag||equip.indexOf(tag)>=0;}

// choose a pull movement based on ability + equipment
function pullMove(p){
  if(has(p.equip,"bar")){
    if(p.maxPull>=6)return"pullup";
    if(p.maxPull>=2)return"chinup";
    if(p.maxPull>=1)return"neg_pullup";
    return"neg_pullup";
  }
  if(has(p.equip,"db"))return"db_row";
  if(has(p.equip,"bands"))return"band_row";
  return"inv_row";
}
function pushMove(p){
  if(p.maxPush<8)return has(p.equip,"bar")||true?(p.maxPush<5?"knee_pushup":"incline_pushup"):"knee_pushup";
  return"pushup";
}

// working reps from a max, scaled by week
function fromMax(max,frac,w,lo,hi){
  var r=Math.round(max*frac*PROG[w-1]);
  return Math.max(lo,Math.min(hi||999,r));
}
// level base for no-baseline movements
function lvlBase(p,beg,int,adv){var b=p.level==="op"?adv:p.level==="sol"?int:beg;return b;}
function lvlReps(p,beg,int,adv,w){return Math.max(6,Math.round(lvlBase(p,beg,int,adv)*PROG[w-1]));}
function lvlTime(p,beg,int,adv,w){return Math.max(15,Math.round(lvlBase(p,beg,int,adv)*PROG[w-1]));}

function block(exId,sets,target,rest,unit){return{ex:exId,sets:sets,target:target,rest:rest,unit:unit};}

// finisher: recomp conditioning circuit (belly-fat angle) — AMRAP style
function finisher(p,w){
  var t=isDeload(w)?25:35;
  return{amrap:isDeload(w)?4:6,items:[
    block("mtn_climber",1,t,0,"sec"),
    block("jump_squat",1,isDeload(w)?10:14,0,"reps"),
    block("flutter",1,t,0,"sec")
  ]};
}

function strengthDay(p,w,focus){
  var pm=pushMove(p),pl=pullMove(p);
  var sets=isDeload(w)?2:(p.level==="op"?4:3);
  var rest=p.level==="op"?75:60;
  var b=[];
  if(focus==="push"||focus==="upper"||focus==="full"){
    b.push(block(pm,sets,p.maxPush?fromMax(p.maxPush,0.55,w,5):lvlReps(p,8,14,22,w),rest,"reps"));
    b.push(block("pike_pushup",sets,lvlReps(p,5,8,12,w),rest,"reps"));
    b.push(block("dip_chair",sets,lvlReps(p,8,12,16,w),45,"reps"));
  }
  if(focus==="pull"||focus==="upper"||focus==="full"){
    var pr = pl==="pullup"?fromMax(p.maxPull,0.55,w,2):pl==="chinup"?Math.max(3,fromMax(p.maxPull,0.6,w,2)):pl==="neg_pullup"?(isDeload(w)?3:5):lvlReps(p,8,12,16,w);
    b.push(block(pl,sets,pr,rest,"reps"));
    b.push(block(has(p.equip,"bands")?"band_row":"inv_row",sets,lvlReps(p,10,13,16,w),45,"reps"));
  }
  if(focus==="legs"||focus==="lower"||focus==="full"){
    b.push(block("squat",sets,p.maxPush?lvlReps(p,16,22,30,w):lvlReps(p,16,22,30,w),rest,"reps"));
    b.push(block("lunge",sets,lvlReps(p,8,11,14,w),45,"reps"));
    b.push(block(p.level==="beg"?"glute_bridge":"split_squat",sets,lvlReps(p,10,10,12,w),45,"reps"));
    b.push(block("wall_sit",2,lvlTime(p,30,45,60,w),40,"sec"));
  }
  // core always
  b.push(block("plank",3,p.plankSec?fromMax(p.plankSec,0.65,w,20):lvlTime(p,30,45,60,w),35,"sec"));
  b.push(block("leg_raise",sets,lvlReps(p,10,14,18,w),35,"reps"));
  return{kind:"str",focus:focusLabel(focus),blocks:b,fin:finisher(p,w)};
}
function focusLabel(f){return{push:"Push + Core",pull:"Pull + Core",legs:"Legs + Core",upper:"Upper Body",lower:"Lower Body",full:"Full Body",core:"Core + Mobility"}[f]||f;}

function conditioningDay(p,w){
  var rounds=isDeload(w)?3:(p.level==="op"?6:4);
  var work=isDeload(w)?30:40;
  var b=[
    block("jumping_jack",rounds,work,15,"sec"),
    block("burpee",rounds,lvlReps(p,6,9,12,w),15,"reps"),
    block("mtn_climber",rounds,work,15,"sec"),
    block("skater",rounds,work,15,"sec"),
    block("high_knees",rounds,work,20,"sec")
  ];
  b.push(block("plank",2,p.plankSec?fromMax(p.plankSec,0.6,w,20):lvlTime(p,30,45,60,w),30,"sec"));
  b.push(block("bicycle",3,lvlReps(p,16,22,28,w),30,"reps"));
  return{kind:"cond",focus:"Conditioning + Core",rounds:rounds,blocks:b};
}

function runDay(p,w){
  var style=["easy","intervals","tempo"][(w-1)%3];
  var rl=p.runLevel||"build"; // build | run | fast
  var base=rl==="fast"?1:rl==="run"?0:-1;
  if(style==="easy"){
    var mins=[18,22,26,14,24,28,32,18][w-1]+base*4;
    return{kind:"run",focus:"Easy Run",run:{style:"easy",desc:"Conversational pace — you can talk in full sentences the whole way.",target:Math.max(12,mins)+" min continuous",mins:Math.max(12,mins)}};
  }
  if(style==="intervals"){
    var reps=isDeload(w)?4:(rl==="fast"?8:6);
    return{kind:"run",focus:"Intervals",run:{style:"intervals",desc:reps+" × 400m hard with 90s walk/jog between. Push the hard ones.",target:reps+" × 400m",mins:10+reps*3}};
  }
  var tmin=isDeload(w)?10:(rl==="fast"?22:16);
  return{kind:"run",focus:"Tempo Run",run:{style:"tempo",desc:"Comfortably hard — breathing heavy but controlled. Negative split if you can.",target:tmin+" min tempo + 5 min easy",mins:tmin+10}};
}

// weekly template of day "kinds"
function template(p){
  var runs=p.includeRuns;
  var d=p.days;
  var t;
  if(d<=3)      t=[["str","full"],[runs?"run":"cond"],["str","full"]];
  else if(d===4)t=[["str","upper"],["str","lower"],[runs?"run":"cond"],["cond"]];
  else if(d===5)t=[["str","push"],["str","pull"],["str","legs"],[runs?"run":"cond"],["cond"]];
  else          t=[["str","push"],["str","pull"],["str","legs"],[runs?"run":"cond"],["cond"],["str","core"]];
  return t;
}

// build one session object for week w, day index i
function buildSession(p,w,i){
  var t=template(p),slot=t[i];
  var s;
  if(slot[0]==="str")s=strengthDay(p,w,slot[1]);
  else if(slot[0]==="run")s=runDay(p,w);
  else s=conditioningDay(p,w);
  s.id="w"+w+"d"+i;
  s.week=w;s.idx=i;
  s.title=s.focus;
  s.est=estMin(s);
  return s;
}
function weekSessions(p,w){var out=[],t=template(p);for(var i=0;i<t.length;i++)out.push(buildSession(p,w,i));return out;}

function estMin(s){
  if(s.kind==="run")return s.run.mins;
  var m=6; // warmup
  (s.blocks||[]).forEach(function(b){
    var per=b.unit==="sec"?(b.target/60):(b.target*3.2/60);
    m+=b.sets*(per+(b.rest||0)/60);
  });
  if(s.fin)m+=s.fin.amrap+1;
  if(s.rounds){} // conditioning already in blocks
  return Math.round(m);
}
function estBurn(s,p){var w=(p.weightLb||175)*0.4536;var met=s.kind==="run"?8.5:s.kind==="cond"?8:6;return Math.round(met*w*(s.est/60));}

/* ============================== SCHEDULE / STATE HELPERS ============================== */
var DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function todayISO(d){d=d||new Date();return d.toISOString().slice(0,10);}
function isDone(id){return!!S.logs[id];}
function weekLogged(w,p){var ss=weekSessions(p,w);return ss.filter(function(s){return isDone(s.id);}).length;}
function nextSession(p){
  var w=S.curWeek,ss=weekSessions(p,w);
  for(var i=0;i<ss.length;i++)if(!isDone(ss[i].id))return ss[i];
  return null; // week complete
}
function streak(){
  // count consecutive days up to today with at least one completed workout
  var days={};Object.keys(S.logs).forEach(function(k){days[S.logs[k].date]=1;});
  var n=0,d=new Date();
  for(var i=0;i<400;i++){
    var iso=todayISO(d);
    if(days[iso]){n++;}
    else if(i>0){break;} // allow today to be not-yet-done
    d.setDate(d.getDate()-1);
  }
  return n;
}
function totalWorkouts(){return Object.keys(S.logs).length;}
function bestRep(exId){var b=0;Object.keys(S.logs).forEach(function(k){var l=S.logs[k];(l.sets||[]).forEach(function(st){if(st.ex===exId&&st.val>b)b=st.val;});});return b;}

/* ============================== MUSCLE MAP + TARGETED BUILDER ============================== */

/* body segments (viewBox 120x240). left-side + center; right side mirrored. */
function mir(s){return {x:120-s.x-s.w,y:s.y,w:s.w,h:s.h,r:s.r,rot:s.rot?-s.rot:0,group:s.group};}
var FRONT_L=[

  {x:40,y:42,w:17,h:22,r:7,group:"chest"},
  {x:38,y:67,w:9,h:32,r:4,group:"obliques"},
  {x:23,y:53,w:13,h:29,r:6,rot:14,group:"biceps"},
  {x:16,y:80,w:12,h:29,r:6,rot:18,group:"forearms"},
  {x:41,y:107,w:16,h:47,r:8,rot:4,group:"quads"},
  {x:43,y:157,w:13,h:45,r:6,rot:2,group:"calves"}
];
var FRONT_C=[{x:50,y:64,w:20,h:38,r:8,group:"core"}];
var BACK_L=[
  {x:28,y:39,w:16,h:13,r:6,rot:-12,group:"shoulders"},
  {x:40,y:44,w:17,h:30,r:7,group:"back"},
  {x:23,y:53,w:13,h:29,r:6,rot:14,group:"triceps"},
  {x:16,y:80,w:12,h:29,r:6,rot:18,group:"forearms"},
  {x:43,y:104,w:15,h:22,r:8,group:"glutes"},
  {x:42,y:127,w:16,h:41,r:8,rot:4,group:"hamstrings"},
  {x:43,y:170,w:13,h:40,r:6,group:"calves"}
];
var BACK_C=[{x:48,y:34,w:24,h:13,r:6,group:"back"},{x:50,y:75,w:20,h:25,r:7,group:"back"}];
var FRONT_SEGS=FRONT_L.concat(FRONT_L.map(mir)).concat(FRONT_C);
var BACK_SEGS=BACK_L.concat(BACK_L.map(mir)).concat(BACK_C);
function segStr(s,fill,op,extra){var t=s.rot?(' transform="rotate('+s.rot+' '+(s.x+s.w/2).toFixed(1)+' '+(s.y+s.h/2).toFixed(1)+')"'):'';return '<rect x="'+s.x+'" y="'+s.y+'" width="'+s.w+'" height="'+s.h+'" rx="'+(s.r||4)+'"'+t+' fill="'+fill+'"'+(op<1?(' opacity="'+op.toFixed(2)+'"'):'')+(extra||'')+'/>';}
function muscleSVG(view,opts){
  opts=opts||{};var segs=view==="front"?FRONT_SEGS:BACK_SEGS,sel=opts.sel,intens=opts.intens||{},inter=opts.interactive;
  var s='<svg viewBox="0 0 120 240" width="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true">';
  s+='<circle cx="60" cy="18" r="11" fill="var(--line-strong)"/><rect x="54" y="27" width="12" height="9" rx="3" fill="var(--line-strong)"/>';
  segs.forEach(function(g){
    var fill,op,extra="";
    if(inter){var on=sel&&sel.has(g.group);fill=on?"var(--accent-bg)":"var(--line-strong)";op=1;extra=' style="cursor:pointer" onclick="toggleMus(\''+g.group+'\')"';}
    else{var t=intens[g.group]||0;fill=t>0?"var(--accent-bg)":"var(--line-strong)";op=t>0?Math.min(1,0.22+0.78*t):1;}
    s+=segStr(g,fill,op,extra);
  });
  return s+'</svg>';
}
function intensFromExWeights(pairs){var g={};pairs.forEach(function(p){var m=EXMUS[p.ex];if(!m)return;(m.p||[]).forEach(function(k){g[k]=(g[k]||0)+p.w;});(m.s||[]).forEach(function(k){g[k]=(g[k]||0)+0.5*p.w;});});var mx=0;Object.keys(g).forEach(function(k){if(g[k]>mx)mx=g[k];});if(mx<=0)return{};var o={};Object.keys(g).forEach(function(k){o[k]=g[k]/mx;});return o;}
function sessionIntens(s){if(!s||s.kind==="run")return{};var pairs=(s.blocks||[]).map(function(b){return{ex:b.ex,w:b.sets};});if(s.fin)s.fin.items.forEach(function(b){pairs.push({ex:b.ex,w:1});});return intensFromExWeights(pairs);}
function logsIntens(){var pairs=[];Object.keys(S.logs).forEach(function(k){(S.logs[k].sets||[]).forEach(function(st){pairs.push({ex:st.ex,w:1});});});return intensFromExWeights(pairs);}
function musChips(intens){return Object.keys(intens).sort(function(a,b){return intens[b]-intens[a];}).slice(0,5).map(function(g){return '<span class="pill amber">'+MUSNAME[g]+'</span>';}).join('');}
function musCardHTML(intens,title){
  if(!intens||!Object.keys(intens).length)return'';
  return '<div class="card muscard"><span class="eyebrow">'+title+'</span>'+
    '<div class="bodywrap"><div class="fig">'+muscleSVG("front",{intens:intens})+'<span>Front</span></div>'+
    '<div class="fig">'+muscleSVG("back",{intens:intens})+'<span>Back</span></div></div>'+
    '<div class="mus-chips">'+musChips(intens)+'</div></div>';
}
/* ---- interactive targeter ---- */
var TARGETSEL=new Set();
function toggleMus(g){if(TARGETSEL.has(g))TARGETSEL.delete(g);else TARGETSEL.add(g);var c=el("targeterCard");if(c)c.innerHTML=targeterInner();}
function targeterInner(){
  var sel=TARGETSEL;var chips=[];sel.forEach(function(g){chips.push('<span class="pill amber">'+MUSNAME[g]+'</span>');});
  var h='<span class="eyebrow">Target an area</span>';
  h+='<p style="color:var(--muted);font-size:13px;margin:4px 0 12px">Tap the muscles you want to focus on. I’ll build a workout that hits exactly those.</p>';
  h+='<div class="bodywrap"><div class="fig">'+muscleSVG("front",{sel:sel,interactive:true})+'<span>Front</span></div>'+
     '<div class="fig">'+muscleSVG("back",{sel:sel,interactive:true})+'<span>Back</span></div></div>';
  h+='<div class="mus-chips">'+(chips.length?chips.join(''):'<span style="color:var(--faint);font-size:12px">Nothing selected yet</span>')+'</div>';
  h+='<button class="btn primary block lg" style="margin-top:13px"'+(sel.size?'':' disabled')+' onclick="buildTargeted()">Build a focused workout ▸</button>';
  return h;
}
function overlay(html){var o=document.createElement("div");o.className="ovl";o.style.cssText="position:fixed;inset:0;z-index:92;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center";o.innerHTML='<div style="background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))">'+html+'</div>';document.body.appendChild(o);o.addEventListener("click",function(e){if(e.target===o)o.remove();});return o;}
function closeOvls(){document.querySelectorAll(".ovl").forEach(function(o){o.remove();});}
function buildTargeted(){
  if(!TARGETSEL.size)return;var groups=[];TARGETSEL.forEach(function(g){groups.push(g);});
  var goals=[["strength","Build strength","Lower reps, harder effort, longer rest."],["size","Build & grow","Moderate reps, solid volume."],["tone","Tone &amp; define","Higher reps, short rest, extra burn."],["endure","Endurance","Circuits, high reps, keep moving."]];
  var inner='<h3 style="font-size:19px;margin-bottom:4px">What’s the goal?</h3><p style="color:var(--muted);font-size:13px;margin:0 0 14px">For '+groups.map(function(g){return MUSNAME[g];}).join(", ")+'.</p>';
  inner+=goals.map(function(g){return '<button class="btn block" style="justify-content:flex-start;text-align:left;height:auto;padding:13px 15px;margin-bottom:9px" onclick="genTargeted(\''+groups.join(",")+'\',\''+g[0]+'\')"><span><b style="display:block">'+g[1]+'</b><span style="font-size:12px;color:var(--muted);font-weight:400">'+g[2]+'</span></span></button>';}).join('');
  inner+='<button class="btn ghost block" onclick="closeOvls()">Cancel</button>';
  overlay(inner);
}
function overlapScore(ex,groups){var m=EXMUS[ex];var sc=0;(m.p||[]).forEach(function(k){if(groups.indexOf(k)>=0)sc+=1;});(m.s||[]).forEach(function(k){if(groups.indexOf(k)>=0)sc+=0.4;});return sc;}
function genTargeted(groupsCSV,goal){
  closeOvls();var groups=groupsCSV.split(","),p=S.profile;
  var cands=Object.keys(EXMUS).filter(function(ex){var L=LIB[ex];if(L.equip&&!has(p.equip,L.equip))return false;return overlapScore(ex,groups)>0;});
  var scored=cands.map(function(ex){return{ex:ex,sc:overlapScore(ex,groups)};}).sort(function(a,b){return b.sc-a.sc;});
  var chosen=[],covered={};
  scored.forEach(function(o){if(chosen.length>=6)return;var covNew=(EXMUS[o.ex].p||[]).some(function(k){return groups.indexOf(k)>=0&&!covered[k];});if(chosen.length<4||covNew){chosen.push(o.ex);(EXMUS[o.ex].p||[]).forEach(function(k){if(groups.indexOf(k)>=0)covered[k]=1;});}});
  groups.forEach(function(g){if(!covered[g]){var f=cands.filter(function(ex){return (EXMUS[ex].p||[]).indexOf(g)>=0;});if(f.length){chosen.push(f[0]);covered[g]=1;}}});
  chosen=chosen.filter(function(v,i,a){return a.indexOf(v)===i;}).slice(0,6);
  if(!chosen.length){toast("No bodyweight moves for that combo — try another area");return;}
  var cfg={strength:{sets:4,rest:90,mult:0.75,hi:8},size:{sets:4,rest:60,mult:1,hi:12},tone:{sets:3,rest:35,mult:1.4,hi:20},endure:{sets:3,rest:25,mult:1.7,hi:26}}[goal];
  function tgt(ex){var L=LIB[ex];
    if(L.type==="time"){var base=L.cat==="core"&&p.plankSec?p.plankSec*0.6:40;return{sets:Math.max(2,cfg.sets-1),target:Math.round(base*(goal==="strength"?0.9:cfg.mult*0.85)),unit:"sec",rest:cfg.rest};}
    var baseR=(ex.indexOf("push")>=0&&p.maxPush)?p.maxPush*0.5:(ex==="pullup"&&p.maxPull)?Math.max(3,p.maxPull*0.5):lvlBase(p,11,15,20);
    var reps=Math.max(5,Math.min(cfg.hi,Math.round(baseR*cfg.mult)));
    return{sets:cfg.sets,target:reps,unit:"reps",rest:cfg.rest};
  }
  var blocks=chosen.map(function(ex){var t=tgt(ex);return{ex:ex,sets:t.sets,target:t.target,rest:t.rest,unit:t.unit};});
  var names=groups.map(function(g){return MUSNAME[g];});
  var s={kind:"custom",week:0,id:"cus"+Date.now(),title:"Targeted · "+names.slice(0,2).join(" + ")+(names.length>2?" +"+(names.length-2):""),focus:names.join(", "),groups:groups,goal:goal,blocks:blocks};
  s.est=estMin(s);
  S.custom=S.custom||[];S.custom.unshift(s);if(S.custom.length>12)S.custom.pop();save();
  TARGETSEL.clear();renderPlan();go("plan");el("main").scrollTop=0;
  toast("Workout built for "+names.join(", "));
}
function deleteCustom(id){S.custom=(S.custom||[]).filter(function(x){return x.id!==id;});save();renderPlan();toast("Removed");}
function customListHTML(p){
  var cs=S.custom||[];if(!cs.length)return'';
  var h='<div class="sec-head"><h2 style="font-size:19px">Your focused workouts</h2></div><div class="stack">';
  cs.forEach(function(s){
    h+='<div class="card" style="padding:14px 15px"><div class="srow" style="border:none;padding:0;background:none">'+
      '<div class="badge" style="color:var(--accent)">&#9733;</div>'+
      '<div class="t"><b>'+esc(s.title)+'</b><span>'+s.blocks.length+' moves · '+s.est+' min · '+({strength:"Strength",size:"Build",tone:"Tone",endure:"Endurance"}[s.goal]||"")+'</span></div>'+
      '<button class="btn primary" onclick="startSession(\''+s.id+'\')">Start</button></div>'+
      '<div class="mus-chips" style="justify-content:flex-start;margin-top:11px">'+s.groups.map(function(g){return '<span class="pill ghost">'+MUSNAME[g]+'</span>';}).join('')+
      '<button class="pill ghost" style="margin-left:auto;cursor:pointer" onclick="deleteCustom(\''+s.id+'\')">Remove</button></div></div>';
  });
  return h+'</div>';
}

/* ============================== VIEWS ============================== */
var app=document.getElementById("app"),ob=document.getElementById("onboarding");
function esc(s){return(""+s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function el(id){return document.getElementById(id);}

function render(){
  if(!S.profile){ob.hidden=false;app.hidden=true;renderOnboarding();return;}
  ob.hidden=true;app.hidden=false;
  renderToday();renderPlan();renderProgress();renderProfile();
}

/* ---------- TODAY ---------- */
function renderToday(){
  var p=S.profile,w=S.curWeek;
  var s=nextSession(p);
  var ss=weekSessions(p,w);
  var doneCount=ss.filter(function(x){return isDone(x.id);}).length;
  var pct=Math.round(doneCount/ss.length*100);
  var h="";
  h+='<div class="sec-head" style="margin-top:4px"><div><div class="eyebrow">'+greeting()+'</div><h2 style="font-size:24px;margin-top:2px">'+esc(p.name||"Athlete")+'</h2></div>'+
     '<span class="pill ghost">Week '+w+' / '+WEEKS+(isDeload(w)?' · Deload':'')+'</span></div>';

  // hero
  if(s){
    var cls=s.kind==="run"?"runday":"";
    h+='<div class="hero '+cls+'">';
    h+='<div class="hero-top"><div><div class="eyebrow">Today · '+(s.kind==="run"?"Run":s.kind==="cond"?"Conditioning":"Strength")+'</div><h1>'+esc(s.title)+'</h1><div class="focus">'+(s.kind==="run"?esc(s.run.target):(s.blocks.length+" movements"+(s.fin?" + finisher":"")))+'</div></div>'+
      '<div class="ring" style="--p:'+pct+'"><i>'+doneCount+'/'+ss.length+'</i></div></div>';
    h+='<div class="hero-meta"><div class="m"><b>'+s.est+'<small>min</small></b><span>Duration</span></div>'+
      '<div class="m"><b>~'+estBurn(s,p)+'<small>kcal</small></b><span>Est. burn</span></div>'+
      (s.kind==="run"?'<div class="m"><b>'+cap(s.run.style)+'</b><span>Run type</span></div>':'<div class="m"><b>'+(s.fin?s.fin.amrap+'<small>min</small>':'—')+'</b><span>Finisher</span></div>')+'</div>';
    h+='<button class="btn '+(s.kind==="run"?"run":"primary")+' block lg" style="margin-top:8px" onclick="startSession(\''+s.id+'\')">Start '+(s.kind==="run"?"Run":"Workout")+' &#9656;</button>';
    h+='</div>';
  }else{
    h+='<div class="hero restday"><div class="eyebrow">Week '+w+' complete</div><h1 style="font-size:26px">Nicely done.</h1>'+
       '<p style="color:var(--muted);margin:8px 0 14px">You\'ve logged every session this week. Take active recovery — a walk, mobility, stretch — then roll into the next block.</p>'+
       '<button class="btn primary block lg" onclick="advanceWeek()">Start Week '+(w+1>WEEKS?1:w+1)+' &#9656;</button></div>';
  }

  // week strip
  h+='<div class="sec-head"><h2>This week</h2><button class="link" onclick="go(\'plan\')">Full plan</button></div>';
  h+='<div class="strip">';
  ss.forEach(function(x,i){
    var done=isDone(x.id),cur=s&&s.id===x.id;
    var k=x.kind==="run"?"run":"";
    h+='<div class="d '+(done?'done ':'')+(cur?'today ':'')+k+'"><div class="lab">'+(x.kind==="run"?"RUN":x.kind==="cond"?"MET":"S"+(i+1))+'</div>'+
       '<div class="dot">'+(done?'&#10003;':(x.kind==="run"?'&#9654;':i+1))+'</div></div>';
  });
  h+='</div>';

  // today's muscle targets
  if(s&&s.kind!=="run"){var ti=sessionIntens(s);if(Object.keys(ti).length){h+='<div style="margin-top:8px"></div>'+musCardHTML(ti,"Today’s targets");}}

  // stat tiles
  h+='<div class="tiles" style="margin-top:20px">'+
     '<div class="tile"><div class="v">'+streak()+'<small> d</small></div><div class="k">Streak</div></div>'+
     '<div class="tile"><div class="v">'+totalWorkouts()+'</div><div class="k">Sessions</div></div>'+
     '<div class="tile"><div class="v">'+(bestRep("pushup")||bestRep("incline_pushup")||bestRep("knee_pushup")||'—')+'</div><div class="k">Best push-ups</div></div>'+
     '</div>';

  // quick weight log
  var lw=S.weights.length?S.weights[S.weights.length-1].v:null;
  h+='<div class="card" style="padding:14px;margin-top:14px"><div class="row" style="align-items:center"><div style="flex:1"><div class="eyebrow">Body weight</div><div style="font-family:var(--font-display);font-size:22px;font-weight:600;margin-top:2px">'+(lw?lw+' <small style="font-size:13px;color:var(--muted)">'+units()+'</small>':'Not logged yet')+'</div></div>'+
     '<button class="btn" onclick="logWeightPrompt()">Log weight</button></div></div>';

  el("todayWrap").innerHTML=h;
}
function greeting(){var hh=new Date().getHours();return hh<12?"Good morning":hh<18?"Good afternoon":"Good evening";}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function units(){return S.profile&&S.profile.units==="kg"?"kg":"lb";}

/* ---------- PLAN ---------- */
function renderPlan(){
  var p=S.profile,w=S.curWeek;
  var h='<div class="card muscard" id="targeterCard" style="margin-top:4px">'+targeterInner()+'</div>';
  h+=customListHTML(p);
  h+='<div class="sec-head"><h2>Your plan</h2><span class="pill amber">'+planLabel(p)+'</span></div>';
  h+='<div class="note" style="margin-bottom:14px">An 8-week block tuned to your baseline. Reps climb each week; weeks 4 &amp; 8 are lighter deloads so you recover and come back stronger. Finishers are short conditioning bursts to drive the recomp. Tap any exercise for a motion guide + video.</div>';
  // week selector
  h+='<div class="row" style="overflow-x:auto;gap:7px;padding-bottom:4px;margin-bottom:6px">';
  for(var i=1;i<=WEEKS;i++){

  }
  h+='</div>';
  var ss=weekSessions(p,w);
  h+='<div class="stack">';
  ss.forEach(function(s,i){
    var done=isDone(s.id);

    h+='<div class="card" style="padding:14px 15px">';
    h+='<div class="srow" style="border:none;padding:0;background:none"><div class="badge '+(done?'':'')+'">'+(done?'&#10003;':(s.kind==="run"?'&#9654;':i+1))+'</div>'+
       '<div class="t"><b>'+esc(s.title)+'</b><span>'+(s.kind==="run"?esc(s.run.target):s.blocks.length+" movements · "+s.est+" min · ~"+estBurn(s,p)+" kcal")+'</span></div>'+
       '<button class="btn '+(s.kind==="run"?'run':'primary')+'" onclick="startSession(\''+s.id+'\')">'+(done?'Redo':'Start')+'</button></div>';
    // detail
    if(s.kind==="run"){
      h+='<div class="exline" style="border-top:1px dashed var(--line);margin-top:11px;padding-top:11px"><div class="n"><b>'+cap(s.run.style)+' run</b><span>'+esc(s.run.desc)+'</span></div></div>';
    }else{
      h+='<div style="margin-top:10px">';
      s.blocks.forEach(function(b){
        var L=LIB[b.ex];
        h+='<div class="exline"><button class="ex-tap n" onclick="openExercise(\''+b.ex+'\')"><div><b>'+esc(L.name)+'</b><span>'+esc(L.cue)+'</span></div><span class="info">?</span></button>'+
           '<div class="tgt">'+b.sets+'&times;'+b.target+(b.unit==="sec"?'s':'')+'<small>'+(b.unit==="sec"?'hold':'reps')+'</small></div></div>';
      });
      if(s.fin){
        h+='<div class="exline"><div class="n"><b>Finisher &mdash; '+s.fin.amrap+' min AMRAP</b><span>'+s.fin.items.map(function(b){return LIB[b.ex].name+' '+b.target+(b.unit==="sec"?'s':'');}).join(' &middot; ')+'</span></div><div class="tgt">'+s.fin.amrap+'<small>min</small></div></div>';
      }
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div>';

function weeklyVolume(logs){

function exSeries(logs,exIds){

}
function runSeries(logs){

/* ---------- simple SVG charts (theme-aware) ---------- */
function barChart(data){
  if(!data.length)return'';
  var W=320,H=140,pl=8,pr=8,pt=12,pb=22;
  var iw=W-pl-pr,ih=H-pt-pb;
  var max=Math.max.apply(null,data.map(function(d){return d.y;}))||1;
  var bw=iw/data.length*0.6,gap=iw/data.length;
  var s='<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img">';
  [0.5,1].forEach(function(f){var y=pt+ih-ih*f;s+='<line class="grid" x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'"/>';});
  data.forEach(function(d,i){
    var bh=d.y/max*ih,x=pl+gap*i+(gap-bw)/2,y=pt+ih-bh;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(2,bh).toFixed(1)+'" rx="4" fill="var(--accent-bg)"/>';
    s+='<text class="axis" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(d.lab)+'</text>';
  });
  s+='<text class="axis" x="'+pl+'" y="'+(pt+2)+'" >'+max+'</text>';
  s+='</svg></div>';return s;
}
function lineChart(data,color,invert){
  if(data.length<2)return'';
  var W=320,H=140,pl=10,pr=14,pt=14,pb=22;
  var iw=W-pl-pr,ih=H-pt-pb;
  var ys=data.map(function(d){return d.y;});
  var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);if(mn===mx){mn=mn-1;mx=mx+1;}
  var pad=(mx-mn)*0.12;mn-=pad;mx+=pad;
  function X(i){return pl+iw*(data.length===1?0.5:i/(data.length-1));}
  function Y(v){return pt+ih-(v-mn)/(mx-mn)*ih;}
  var s='<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img">';
  [0,0.5,1].forEach(function(f){var y=pt+ih*f;s+='<line class="grid" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'"/>';});
  var dAttr=data.map(function(d,i){return(i?'L':'M')+X(i).toFixed(1)+' '+Y(d.y).toFixed(1);}).join(' ');
  var area=dAttr+' L'+X(data.length-1).toFixed(1)+' '+(pt+ih)+' L'+X(0).toFixed(1)+' '+(pt+ih)+' Z';
  s+='<path d="'+area+'" fill="'+color+'" opacity="0.12"/>';
  s+='<path d="'+dAttr+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  data.forEach(function(d,i){var last=i===data.length-1;s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(d.y).toFixed(1)+'" r="'+(last?4.5:3)+'" fill="'+(last?color:'var(--surface)')+'" stroke="'+color+'" stroke-width="2"/>';});
  // end label
  var ld=data[data.length-1];
  s+='<text class="axis" x="'+(W-pr)+'" y="'+Math.max(pt+6,Y(ld.y)-7).toFixed(1)+'" text-anchor="end" style="fill:'+color+';font-weight:700">'+ld.y+'</text>';
  s+='<text class="axis" x="'+X(0).toFixed(1)+'" y="'+(H-7)+'" text-anchor="start">'+esc(data[0].lab)+'</text>';
  s+='<text class="axis" x="'+(W-pr)+'" y="'+(H-7)+'" text-anchor="end">'+esc(ld.lab)+'</text>';
  s+='</svg></div>';return s;
}

var PL=null,timer=null,actx=null;
function startSession(id){
  var p=S.profile,s;
  if(id.indexOf("cus")===0){s=(S.custom||[]).filter(function(x){return x.id===id;})[0];if(!s)return;}
  else{var m=id.match(/w(\d+)d(\d+)/);s=buildSession(p,+m[1],+m[2]);}
  // build steps
  var steps=[];
  steps.push({t:"ready",s:s});
  if(s.kind==="run"){
    steps.push({t:"run",run:s.run});
  }else{
    s.blocks.forEach(function(b){
      for(var k=0;k<b.sets;k++){
        steps.push({t:"work",b:b,setNo:k+1});
        if(k<b.sets-1)steps.push({t:"rest",secs:b.rest,next:LIB[b.ex].name});
      }
    });
    if(s.fin){steps.push({t:"finintro",fin:s.fin});steps.push({t:"fin",fin:s.fin});}
  }
  steps.push({t:"done",s:s});
  PL={id:id,s:s,steps:steps,i:0,logged:[],start:Date.now()};
  el("player").hidden=false;
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  renderStep();
}

/* ---------- CSV import (Strong / Hevy / FitNotes) ---------- */
function onCSV(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{importCSV(String(r.result));}catch(err){toast("Couldn’t read that file");}};r.readAsText(f);e.target.value="";}
function parseCSVLine(line){var out=[],cur="",q=false;for(var i=0;i<line.length;i++){var c=line[i];if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}else{if(c==='"')q=true;else if(c===","){out.push(cur);cur="";}else cur+=c;}}out.push(cur);return out;}
function normDate(s){if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);var m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);if(m){var y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+("0"+m[1]).slice(-2)+"-"+("0"+m[2]).slice(-2);}return null;}
function importCSV(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim().length;});
  if(lines.length<2){toast("That file looks empty");return;}
  var head=parseCSVLine(lines[0]).map(function(s){return s.trim().toLowerCase();});
  function findCol(cands){for(var i=0;i<head.length;i++)for(var j=0;j<cands.length;j++)if(head[i]===cands[j]||head[i].indexOf(cands[j])>=0)return i;return -1;}
  var di=findCol(["date","start_time","start time"]),ei=findCol(["exercise_title","exercise name","exercise"]),ri=findCol(["reps","rep count"]);
  if(ei<0||ri<0){toast("Couldn’t find exercise/reps columns in that CSV");return;}
  var byDate={},n=0;
  for(var k=1;k<lines.length;k++){
    var row=parseCSVLine(lines[k]);if(row.length<=ei)continue;
    var name=(row[ei]||"").trim();var reps=parseInt((row[ri]||"").replace(/[^0-9]/g,""),10);
    if(!name||!reps)continue;
    var date=di>=0?normDate((row[di]||"").trim()):null;if(!date)date=todayISO();
    (byDate[date]=byDate[date]||[]).push({ex:"imp:"+name.toLowerCase(),val:reps});n++;
  }
  var days=Object.keys(byDate);if(!days.length){toast("No sets found in that file");return;}
  days.forEach(function(d){var sets=byDate[d];var vol=sets.reduce(function(a,b){return a+b.val;},0);var id="imp_"+d;S.logs[id]={id:id,date:d,ts:(new Date(d).getTime()||Date.now()),week:0,kind:"imported",min:Math.max(10,Math.round(sets.length*2.5)),vol:vol,sets:sets};});
  save();render();go("progress");toast("Imported "+n+" sets · "+days.length+" workouts");
}

function svgEl(t){return document.createElementNS(NS,t);}
function setPoly(e,pts){e.setAttribute("points",pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" "));}
function buildK(a){if(a._K)return a._K;var ps=a.poses;a._K=a.mode==="pp"?ps.concat(ps.slice(1,-1).reverse()):ps;return a._K;}
function sample(a,t){var K=buildK(a),L=K.length;if(!isFinite(t))t=0;t=((t%1)+1)%1;var tt=t*L,i=Math.floor(tt)%L;if(i<0)i+=L;var f=tt-Math.floor(tt),x=K[i],y=K[(i+1)%L],o={};PKEYS.forEach(function(k){o[k]=x[k]+(y[k]-x[k])*f;});return o;}

var FIGS=[],loopOn=false;
function makeFig(container,exId,cls){
  if(!container)return;
  var meta=EXMETA[exId]||{anim:"squat"},anim=ANIM[meta.anim]||ANIM.squat;
  container.innerHTML="";if(cls)container.className=container.className+" "+cls;
  var svg=svgEl("svg");svg.setAttribute("viewBox","0 0 100 100");svg.setAttribute("aria-hidden","true");
  var floor=svgEl("line");floor.setAttribute("x1","8");floor.setAttribute("y1","87");floor.setAttribute("x2","92");floor.setAttribute("y2","87");floor.setAttribute("class","floor");floor.setAttribute("stroke-width","1.5");floor.setAttribute("stroke-dasharray","2 4");floor.setAttribute("stroke-linecap","round");svg.appendChild(floor);
  var spine=svgEl("polyline"),al=svgEl("polyline"),ar=svgEl("polyline"),ll=svgEl("polyline"),lr=svgEl("polyline"),head=svgEl("circle");
  [spine,al,ar,ll,lr].forEach(function(e){e.setAttribute("fill","none");e.setAttribute("stroke","currentColor");e.setAttribute("stroke-width","3.6");e.setAttribute("stroke-linecap","round");e.setAttribute("stroke-linejoin","round");svg.appendChild(e);});
  head.setAttribute("r",HR);head.setAttribute("fill","none");head.setAttribute("stroke","currentColor");head.setAttribute("stroke-width","3.6");svg.appendChild(head);
  container.appendChild(svg);
  function update(p){
    var sh=fk(p.rx,p.ry,TORSO,p.torso),hc=fk(sh[0],sh[1],HEAD,p.head);
    var alo=[sh[0]-1.4,sh[1]],aro=[sh[0]+1.4,sh[1]];
    var eL=fk(alo[0],alo[1],UA,p.uaL),hL=fk(eL[0],eL[1],FA,p.faL);
    var eR=fk(aro[0],aro[1],UA,p.uaR),hR=fk(eR[0],eR[1],FA,p.faR);
    var hlo=[p.rx-2,p.ry],hro=[p.rx+2,p.ry];
    var kL=fk(hlo[0],hlo[1],TH,p.thL),fL=fk(kL[0],kL[1],SHIN,p.shL);
    var kR=fk(hro[0],hro[1],TH,p.thR),fR=fk(kR[0],kR[1],SHIN,p.shR);
    setPoly(spine,[[p.rx,p.ry],sh,hc]);head.setAttribute("cx",hc[0].toFixed(1));head.setAttribute("cy",hc[1].toFixed(1));
    setPoly(al,[alo,eL,hL]);setPoly(ar,[aro,eR,hR]);setPoly(ll,[hlo,kL,fL]);setPoly(lr,[hro,kR,fR]);
  }
  if(REDUCED){update(sample(anim,0.35));return;}
  FIGS.push({el:container,update:update,anim:anim,start:performance.now()});
  update(sample(anim,0));startLoop();
}
function startLoop(){if(loopOn)return;loopOn=true;requestAnimationFrame(tick);}
function tick(now){
  for(var i=FIGS.length-1;i>=0;i--){var f=FIGS[i];if(!document.body.contains(f.el)){FIGS.splice(i,1);continue;}f.update(sample(f.anim,(now-f.start)/1000/f.anim.dur));}
  if(FIGS.length)requestAnimationFrame(tick);else loopOn=false;
}
